name: Check prices

on:
  schedule:
    # Off the hour: GitHub delays (and sometimes drops) scheduled runs at :00 when load peaks.
    - cron: "17 5 * * *" # 07:17 Warsaw (summer) / 06:17 (winter)
    # Backup in case the first run is dropped. If the first run happened, this costs no Google
    # searches (the daily budget is used) and only refreshes the free Aviasales data.
    - cron: "43 9 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run check-prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # Logs are public on a public repo, so print only totals, not routes, dates or prices.
        # Full details are on the dashboard.
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "x-trigger: schedule" \
            --max-time 150 \
            -o result.json \
            https://uorpnghoagbnwrdyrgre.supabase.co/functions/v1/check-prices \
            || { echo "check-prices failed (details in Supabase → Edge Functions → Logs)"; exit 1; }
          summary=$(jq -r '"Watches: \(.watches | length) · fares found: \([.watches[].fares] | add // 0) · alerts sent: \(.alertsSent) · search errors: \(.errors | length)"' result.json)
          echo "$summary"
          echo "### Price check: $summary" >> "$GITHUB_STEP_SUMMARY"
          rm result.json
