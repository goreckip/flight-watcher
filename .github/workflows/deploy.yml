name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PROJECT_REF: uorpnghoagbnwrdyrgre

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Type-check Edge Functions
        run: npm run check

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets are configured
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD TRAVELPAYOUTS_TOKEN RESEND_API_KEY ALERT_EMAIL_TO CRON_SECRET APP_PASSWORD SERPAPI_KEY; do
            if [ -n "${!name}" ]; then echo "✔ $name"; else echo "::error::Missing repository secret: $name"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets (exact uppercase names)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Sync function secrets
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            "TRAVELPAYOUTS_TOKEN=$TRAVELPAYOUTS_TOKEN" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "ALERT_EMAIL_TO=$ALERT_EMAIL_TO" \
            "CRON_SECRET=$CRON_SECRET" \
            "APP_PASSWORD=$APP_PASSWORD" \
            "SERPAPI_KEY=$SERPAPI_KEY"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy check-prices --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy weekly-digest --project-ref "$PROJECT_REF" --no-verify-jwt
