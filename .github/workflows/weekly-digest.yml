name: Weekly summary (manual)

# The Sunday 18:03 (Warsaw) schedule runs inside Supabase with pg_cron; see
# supabase/migrations/*_db_scheduler.sql. This workflow sends the summary on demand.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly summary
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # Logs are public: print only whether it was sent.
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "x-trigger: manual" \
            --max-time 120 \
            -o result.json \
            https://uorpnghoagbnwrdyrgre.supabase.co/functions/v1/weekly-digest \
            || { echo "weekly-digest failed (details in Supabase → Edge Functions → Logs)"; exit 1; }
          summary=$(jq -r '"Sent: \(.sent) · watches: \(.watches)"' result.json)
          echo "$summary"
          echo "### Weekly summary: $summary" >> "$GITHUB_STEP_SUMMARY"
          rm result.json
